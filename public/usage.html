<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>WEEKLY LIMIT</title>
<style>
  :root{
    --accent:#22d3ee;
    --accent-dim:rgba(34,211,238,.28);
    --ink:#e8f6f9;
    --muted:#5b7a82;
    --line:rgba(34,211,238,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    overflow:hidden;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:56px 56px;
    background-position:center;
  }
  .frame{position:fixed;inset:14px;border:1px solid var(--accent-dim);pointer-events:none}
  .frame::before,.frame::after{content:"";position:absolute;width:22px;height:22px;border-color:var(--accent);border-style:solid}
  .frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
  .frame::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:8px}
  .label{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:12px;letter-spacing:.42em;color:var(--accent);
    text-transform:uppercase;text-indent:.42em;
  }
  .sublabel{font-size:11px;letter-spacing:.3em;color:var(--muted);text-indent:.3em}
  .ringbox{position:relative;width:min(74vw,340px);aspect-ratio:1;margin:10px 0 2px}
  svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:5}
  .ring .bar{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:butt;
    filter:drop-shadow(0 0 10px var(--accent-dim));transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1),stroke .5s}
  .ring .ticks{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pct{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;
    font-size:clamp(84px,26vw,128px);line-height:1;color:var(--ink);
    text-shadow:0 0 26px var(--accent-dim)}
  .pct small{font-size:.38em;color:var(--accent);margin-left:2px}
  .cap{font-size:11px;letter-spacing:.34em;color:var(--muted);margin-top:8px;text-indent:.34em}
  .tiles{display:flex;gap:10px;margin-top:18px;width:min(92vw,430px)}
  .tile{flex:1;border:1px solid var(--line);padding:12px 8px 10px;text-align:center;background:rgba(0,0,0,.55)}
  .tile .k{font-size:10px;letter-spacing:.22em;color:var(--muted)}
  .tile .v{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:19px;margin-top:5px;color:var(--ink);white-space:nowrap}
  .tile .v em{font-style:normal;color:var(--accent)}
  .foot{margin-top:20px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10px;letter-spacing:.18em;color:var(--muted)}
  .foot .dot{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-right:7px;vertical-align:1px;animation:blink 2.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  body.warn{--accent:#fbbf24;--accent-dim:rgba(251,191,36,.3);--line:rgba(251,191,36,.16)}
  body.danger{--accent:#f87171;--accent-dim:rgba(248,113,113,.32);--line:rgba(248,113,113,.18)}
</style>
</head>
<body>
<div class="frame"></div>
<div class="wrap">
  <div class="label">Weekly Limit</div>
  <div class="sublabel">週間枠 使用量</div>

  <div class="ringbox">
    <svg class="ring" viewBox="0 0 200 200">
      <circle class="ticks" cx="100" cy="100" r="96" stroke-dasharray="1 9.467"/>
      <circle class="track" cx="100" cy="100" r="86"/>
      <circle class="bar" id="bar" cx="100" cy="100" r="86" stroke-dasharray="540.35" stroke-dashoffset="540.35"/>
    </svg>
    <div class="center">
      <div class="pct"><span id="pct">--</span><small>%</small></div>
      <div class="cap">USED</div>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="k">残り</div><div class="v" id="left">--<em>%</em></div></div>
    <div class="tile"><div class="k">リセットまで</div><div class="v" id="count">--</div></div>
    <div class="tile"><div class="k">追加トークン</div><div class="v" id="tokens">--</div></div>
  </div>

  <div class="foot"><span class="dot"></span><span id="updated">CONNECTING</span></div>
</div>

<script>
  var DATA_URL = "https://raw.githubusercontent.com/ak310com82-tech/meal-analyzer/odds-data/data/usage.json";
  var CIRC = 540.35, resetAt = null, shownPct = 0, targetPct = null;

  function fmtCountdown(ms){
    if (ms <= 0) return "0:00:00";
    var s = Math.floor(ms/1000);
    var d = Math.floor(s/86400); s -= d*86400;
    var h = Math.floor(s/3600); s -= h*3600;
    var m = Math.floor(s/60); s -= m*60;
    var hh = ("0"+h).slice(-2), mm = ("0"+m).slice(-2), ss = ("0"+s).slice(-2);
    return (d>0 ? d+"日 " : "") + hh + ":" + mm + ":" + ss;
  }
  function tick(){
    if (resetAt) document.getElementById("count").textContent = fmtCountdown(resetAt - Date.now());
  }
  setInterval(tick, 1000);

  function animatePct(){
    if (targetPct === null) return;
    var step = (targetPct - shownPct) * 0.12;
    if (Math.abs(step) < 0.05) step = targetPct - shownPct;
    shownPct += step;
    if (Math.abs(targetPct - shownPct) < 0.05) shownPct = targetPct;
    document.getElementById("pct").textContent = Math.round(shownPct);
    if (shownPct !== targetPct) requestAnimationFrame(animatePct);
  }

  function render(d){
    targetPct = d.used_pct;
    requestAnimationFrame(animatePct);
    document.getElementById("bar").style.strokeDashoffset = (CIRC * (1 - d.used_pct/100)).toFixed(2);
    document.getElementById("left").innerHTML = (100 - d.used_pct) + "<em>%</em>";
    document.getElementById("tokens").textContent = d.tokens_left || "--";
    document.body.className = d.used_pct >= 90 ? "danger" : (d.used_pct >= 70 ? "warn" : "");
    resetAt = new Date(d.reset_at).getTime();
    tick();
    var u = new Date(d.updated_at);
    document.getElementById("updated").textContent =
      "UPDATED " + ("0"+u.getHours()).slice(-2) + ":" + ("0"+u.getMinutes()).slice(-2);
  }

  function load(){
    fetch(DATA_URL + "?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function(){ document.getElementById("updated").textContent = "OFFLINE — RETRYING"; });
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
